name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Coverage report
        run: |
          {
            echo "## Coverage $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
            echo
            echo '<details><summary>Per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          color=red
          if awk "BEGIN{exit !($pct >= 80)}"; then color=brightgreen
          elif awk "BEGIN{exit !($pct >= 60)}"; then color=yellow
          fi
          mkdir badge && cd badge
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"$pct%\",\"color\":\"$color\"}" > coverage.json
          git init -q -b badges
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add coverage.json
          git commit -q -m "Update coverage badge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
